<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pUI · 抓包报文时序分析</title>
    <style>
      /* 启动加载层:WebView 首帧即渲染,消除 JS bundle 加载期间的白屏。
        表情球为 emotion-ball 官方引擎原样嵌入(纯 SVG 零图片,还原度要求),
        源:https://github.com/sam70361/aora-bot (emotion-ball/js/ 四件套),
        许可:引擎个人学习研究免费/商用需授权,角色视觉形象仅限个人学习研究
        —— 详见 vendor 说明 public/emotion-ball/NOTICE.md。 */
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
        z-index: 9999;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        user-select: none;
        transition: opacity 0.25s ease;
      }
      #boot.bye {
        opacity: 0;
        pointer-events: none;
      }
      #boot-ball {
        width: 180px;
        height: 180px;
      }
      .boot-title {
        font-size: 15px;
        font-weight: 600;
        color: #0f172a;
        letter-spacing: 0.5px;
      }
      .boot-sub {
        font-size: 12px;
        color: #94a3b8;
        min-height: 16px;
      }
    </style>
  </head>

  <body>
    <div id="boot">
      <div id="boot-ball"></div>
      <div class="boot-title">pUI 抓包报文时序分析</div>
      <div class="boot-sub">正在启动…</div>
    </div>
    <div id="root"></div>
    <!-- emotion-ball 官方引擎(原样引入,勿改动;升级时整目录替换) -->
    <script src="/emotion-ball/js/rings.js"></script>
    <script src="/emotion-ball/js/emotions.js"></script>
    <script src="/emotion-ball/js/ball.js"></script>
    <script src="/emotion-ball/js/engine.js"></script>
    <!-- pUI 接入层:创建实例 + 把销毁钩子暴露给 main.tsx -->
    <script src="/emotion-ball/boot.js"></script>
    <!-- React 入口(缺失=Vite 不打包应用,启动屏永远不退场——有契约测试钉住) -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
